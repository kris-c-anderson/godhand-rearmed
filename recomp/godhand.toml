[general]
# God Hand (USA, SLUS-21503). Modeled on the Urban Reign port's recomp/urban.toml. build.py generate rewrites input and
# output to build/ and makes ghidra_output and runtime_relocations absolute (relative to this folder).
input = "../build/SLUS_215.03"
output = "../generated"
single_file_output = false
output_worker_threads = 8
# Function boundaries (port_prep/boundaries, build_boundaries.py + validate_boundaries.py, 10,553 rows). Every row has a
# non-auto name, so every range is authoritative; the recompiler's own discoveries are kept only outside them.
ghidra_output = "godhand_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
# SDK functions are bound by address to runtime handlers at start-up (src/godhand/hle_bindings.cpp); the CSV carries SDK
# names that would otherwise be stubbed by name (types.h default is true).
auto_stub_by_name = false
# Tail jumps go through the dispatch table, so a replaced (HLE) function is reached by every caller.
direct_tail_calls = false
# .data (0x3BBF80, flags WAX) counts as code for the recompiler, which made 46 functions there on the first generate.
# None is EE code run at its .data address (recomp/godhand_data_section_functions.txt): byte tables (0x3BBF80-0x3C01D8),
# zero buffers (0x3F86C0-0x3FA1C0), a "3100" version string (0x3FAE3C), GS/VIF/DMA packet data (0x3FA1F8, 0x3FD280,
# 0x3FDD40), a 60-byte struct array (0x3FC7B8), and the libkernl kernel-patch blobs that InitExecPS2 (0x3FAF20),
# InitAlarm (0x3FB6E8) and InitTLBFunctions (0x3FBEC0) copy to 0x80074000/0x80076000/0x80075000. No jal or j reaches
# any of them. Skipped by address: each becomes a TODO_NAMED stub (a warning and a return if it were ever called).
skip = [
    "0x003BBF80", "0x003BBFA8", "0x003BBFD0", "0x003BBFF8", "0x003BC200", "0x003BC248",
    "0x003BC380", "0x003BC3A8", "0x003BC3D0", "0x003BC3F8", "0x003BC5E0", "0x003BC5F8",
    "0x003BC610", "0x003BC628", "0x003BF958", "0x003BF970", "0x003BF988", "0x003BF9A0",
    "0x003BFB48", "0x003BFC98", "0x003BFFD0", "0x003BFFE8", "0x003C0000", "0x003C0018",
    "0x003C0138", "0x003C0160", "0x003C0188", "0x003C01B0", "0x003C01D8", "0x003F86C0",
    "0x003F8740", "0x003F9740", "0x003F9800", "0x003F9810", "0x003F9840", "0x003F9C80",
    "0x003FA0C0", "0x003FA1C0", "0x003FA1F8", "0x003FAE3C", "0x003FAF20", "0x003FB6E8",
    "0x003FBEC0", "0x003FC7B8", "0x003FD280", "0x003FDD40",
]
stubs = []
# The 282 boot-ELF .text sites God Hand's SNR2 loader patches (82 j26, 100 hi16, 100 lo16 in 25 functions); read from
# guest RAM at run time (port_prep/runtime-relocs). The 208 R_MIPS_32 .data slots (godhand_data_import_slots.csv, kind
# w32) are deliberately NOT listed: the recompiler accepts only j26/hi16/lo16 and the slots stay in guest RAM.
runtime_relocations = "godhand_runtime_relocations.csv"

# Switchable patches (ps2xRecomp: both forms are compiled in, the run-time flag picks one; src/godhand/frame_patches.cpp
# sets the flags from godhand.ini and holds the hooks). "fps60": the 60 FPS mode, a port of the PCSX2 patch
# SLUS-21503_6FB69282.pnach "60 Fps" (Puggsy + Claude Ai + Gemini). "frame_hook": always on.
[patches]

# Special attack speed, God Hand gauge drain, gene menu: 0.5 instead of 1.0 (lui at,0x3F80 -> 0x3F00).
[[patches.conditional]]
address = "0x00302D04"
value = "0x3C013F00"
flag = "fps60"

[[patches.conditional]]
address = "0x0010D694"
value = "0x3C013F00"
flag = "fps60"

[[patches.conditional]]
address = "0x0010B7B8"
value = "0x3C013F00"
flag = "fps60"

# Enemy physics and animation speed 0.5 ...
[[patches.conditional]]
address = "0x0029059C"
value = "0x3C013F00"
flag = "fps60"

# ... and the enemy animation back to normal: the step passed to 0x158288 is doubled (mov.s f12,f1 -> add.s f12,f1,f1;
# the pnach does lui/mtc1/mul.s by 2.0 in a code cave).
[[patches.conditional]]
address = "0x00290584"
value = "0x46010B00"
flag = "fps60"

# Dodge sync: the add.s f0,f0,f0 in the beql delay slot is not run.
[[patches.conditional]]
address = "0x0015765C"
value = "0x00000000"
flag = "fps60"

# Roulette time (the pnach drops this store, freezing the timer): the player's roulette timer (sw v0,0x15B0(s1), 102
# frames) is stored only every other frame, so it runs at the PS2's speed.
[[patches.hooks]]
address = "0x001147CC"
hook = "gh_fps60_roulette_timer"
flag = "fps60"
replace = true

# HUD and menu animations (cIDBase_move: lbu v0,0x1C(s1), 0 = no animation step): stepped every other frame.
[[patches.hooks]]
address = "0x002AAA88"
hook = "gh_fps60_ui_anim"
flag = "fps60"
replace = true

# Timed action button prompts (TimedButton_tick: addiu v0,v1,-1 on +0x32): count down every other frame.
[[patches.hooks]]
address = "0x001F6F8C"
hook = "gh_fps60_button_timer"
flag = "fps60"
replace = true

# Stick-wiggle button prompt (cCockActButton move, type 4): every other frame's swing is undone (before
# lw a1,0xD4(a2), the case's first instruction; and at its end, before addiu v0,zero,-1).
[[patches.hooks]]
address = "0x0013BF08"
hook = "gh_fps60_wiggle_begin"
flag = "fps60"

[[patches.hooks]]
address = "0x0013C020"
hook = "gh_fps60_wiggle_end"
flag = "fps60"

# Scrolling-arrow button prompts (types 5 and 6): half the step per frame (y +4.0 -> +2.0, x -6.0 -> -3.0).
[[patches.conditional]]
address = "0x0013C0A0"
value = "0x3C014000"
flag = "fps60"

[[patches.conditional]]
address = "0x0013C104"
value = "0x3C014040"
flag = "fps60"

# Roulette TIME dial (cCockRoulette move, addiu v0,v0,-1 on +0x4D0, 95 frames): counts down every other frame.
[[patches.hooks]]
address = "0x0014530C"
hook = "gh_fps60_roulette_dial"
flag = "fps60"
replace = true

# Hitbox sync: c.eq.s f0,f2 -> "same integer frame" (the pnach's code cave at 0xF0000).
[[patches.hooks]]
address = "0x002C81C0"
hook = "gh_fps60_hitbox_compare"
flag = "fps60"
replace = true

# Top of the main loop, after the wait for the next frame: frame divider, stick hold (fps60), L3 dash, frame count.
[[patches.hooks]]
address = "0x0030ADF4"
hook = "gh_frame_start"
flag = "frame_hook"

# Widescreen ("widescreen", src/godhand/widescreen.cpp): the constants of the PCSX2 16:9 patch (nemesis2000 and
# Arapapa), computed for the chosen aspect ratio; each hook sets $at instead of the instruction.
# Camera horizontal view (lui at,0x3F6E / ori at,at,0xEEEF = 0.9333).
[[patches.hooks]]
address = "0x0030B8F4"
hook = "gh_ws_camera_width"
flag = "widescreen"
replace = true

# Font width (lui at,0x3F66 / ori at,at,0x6666 = 0.9).
[[patches.hooks]]
address = "0x002AF4FC"
hook = "gh_ws_font_width"
flag = "widescreen"
replace = true

# Health gauge width (lui at,0x3F80 = 1.0).
[[patches.hooks]]
address = "0x0014300C"
hook = "gh_ws_gauge_width"
flag = "widescreen"
replace = true

