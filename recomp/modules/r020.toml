[general]
# r020.rel (SNR2 DLL, "..\PS2_EE_Release\r020.elf") statically linked at 0x00799080 by
#   python -I tools/snr2/gen_modules.py r020   (= tools/snr2/snr2.py emit r020 --base 0x799080)
# and recompiled by 'python -I build.py modules r020' into build/snr2/gen/r020, then packed into
# generated_modules/r020/ (never generated/). Class 'room': slot heap 0x799000/0xF000 (cRelSys_loadSlot ReadAlloc, ra 0x2BE5A0, redirected from heap D 0x754220).
# The generated code is valid only at that base (literal PCs/return addresses), checked at link time by
# src/godhand/function_hooks.cpp (name + base + code sha256).
# Paths are relative to this file; build.py modules makes them absolute.
input = "../../build/snr2/out/r020/r020.elf"
output = "../../build/snr2/gen/r020"
single_file_output = false
output_worker_threads = 4
# 28 routine starts from snr2.py. Authoritative.
ghidra_output = "../../build/snr2/out/r020/r020_functions.csv"
ghidra_map_merge = true
patch_syscalls = false
patch_cop0 = false
patch_cache = false
auto_stub_by_name = false
direct_tail_calls = false
skip = []
stubs = []
# No runtime relocations: every import resolves to a boot .sndata export at static-link time
# (r020_runtime_relocations.csv has 0 rows).

# [Game] UnlockHard (GODHAND_UNLOCK_HARD): the difficulty select treats Hard as unlocked. The save's flag
# (0x747A28 bit 0x200000, set by a clear) is only read here, never written, so a save is not changed by it.
# Each 'and rX,rY,<0x200000>' on the flag becomes 'or rX,zero,<0x200000>':
#   0x79B25C  the menu's item animation (locked Hard does not grow)
#   0x79B374  the confirm (locked Hard buzzes)
#   0x79B924  the item sprites (Hard or the locked plate)
[[patches.conditional]]
address = "0x0079B25C"
value = "0x00061025"
flag = "unlock_hard"

[[patches.conditional]]
address = "0x0079B374"
value = "0x00031025"
flag = "unlock_hard"

[[patches.conditional]]
address = "0x0079B924"
value = "0x00041825"
flag = "unlock_hard"

# 0x799530: the room's init picks the three difficulty entries' message/sprite ids by the same flag (38, 39, 40 with
# Hard unlocked; 11, 12, 13 with it locked, the locked plate). Without this one the Hard sprite from 0x79B924 was
# drawn over the locked layout and the cursor could not reach it. and v0,v0,v1 -> or v0,zero,v1.
[[patches.conditional]]
address = "0x00799530"
value = "0x00031025"
flag = "unlock_hard"
